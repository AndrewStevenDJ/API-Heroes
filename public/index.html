<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhiBlu - Mi Mascota Virtual</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Scripts del juego -->
  <script src="pet-selector.js?v=20250731-1741-CLEAN"></script>
  <script src="verificar-cache.js?v=20250731-1741"></script>
  <!-- Limpieza inmediata para evitar flash de barras -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cleanup = () => {
        const stats = document.getElementById('stats-container');
        const buttons = document.getElementById('action-buttons');
        if (stats) stats.remove();
        if (buttons) buttons.remove();
      };
      cleanup();
      // Repetir limpieza por 2 segundos
      const interval = setInterval(cleanup, 100);
      setTimeout(() => clearInterval(interval), 2000);
    });
  </script>
  <!-- No cargamos clean-interface por ahora -->
  <!-- No agregamos script de emergencia en el head para evitar interferencias -->
</head>
<body>
  <!-- Pantalla de bienvenida -->
  <div id="welcome-view">
    <div id="logo-conejo">
      <!-- SVG cabeza de conejo -->
      <svg width="110" height="110" viewBox="0 0 110 110">
        <ellipse cx="55" cy="70" rx="38" ry="32" fill="#fff" stroke="#bbb" stroke-width="3"/>
        <ellipse cx="35" cy="30" rx="13" ry="28" fill="#fff" stroke="#bbb" stroke-width="3"/>
        <ellipse cx="75" cy="30" rx="13" ry="28" fill="#fff" stroke="#bbb" stroke-width="3"/>
        <ellipse cx="35" cy="30" rx="6" ry="18" fill="#f9c2d1"/>
        <ellipse cx="75" cy="30" rx="6" ry="18" fill="#f9c2d1"/>
        <ellipse cx="55" cy="80" rx="18" ry="10" fill="#f9c2d1"/>
        <ellipse cx="45" cy="70" rx="4" ry="6" fill="#222"/>
        <ellipse cx="65" cy="70" rx="4" ry="6" fill="#222"/>
        <ellipse cx="55" cy="90" rx="5" ry="2" fill="#222"/>
      </svg>
    </div>
    <h1>Bienvenido a <span class="whiblu">WhiBlu</span></h1>
    <div id="welcome-buttons">
      <button id="btn-register">Registrarse</button>
      <button id="btn-login">Iniciar sesión</button>
    </div>
  </div>

  <!-- Vista de registro -->
  <div id="register-view" class="hidden">
    <h2>Crear cuenta</h2>
    <form id="register-form">
      <label for="register-username">Usuario</label>
      <input type="text" id="register-username" required autocomplete="username">
      <label for="register-password">Contraseña</label>
      <input type="password" id="register-password" required autocomplete="new-password">
      <button type="submit">Registrarse</button>
      <div id="register-message" class="form-message"></div>
    </form>
    <p>
      ¿Ya tienes cuenta? <a href="#" id="go-login">Inicia sesión</a><br>
      <a href="#" id="back-to-welcome1">Volver a la bienvenida</a>
    </p>
  </div>

  <!-- Vista de inicio de sesión -->
  <div id="login-view" class="hidden">
    <h2>Iniciar sesión</h2>
    <form id="login-form">
      <label for="login-username">Usuario</label>
      <input type="text" id="login-username" required autocomplete="username">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit">Iniciar sesión</button>
      <div id="login-message" class="form-message"></div>
    </form>
    <p>
      ¿No tienes cuenta? <a href="#" id="go-register">Regístrate</a><br>
      <a href="#" id="back-to-welcome2">Volver a la bienvenida</a>
    </p>
  </div>

  <!-- Pantalla de selección de mascota (carrusel) -->
  <div id="select-pet-view" class="hidden">
    <h2 id="pet-name" class="pet-name-top"></h2>
    <h3>¡Elige tu mascota!</h3>
    <div id="pet-carousel">
      <button id="prev-pet" class="carousel-btn">&#8592;</button>
      <div id="pet-svg-container">
        <!-- SVG de la mascota actual -->
      </div>
      <button id="next-pet" class="carousel-btn">&#8594;</button>
    </div>
    <div id="pet-info">
      <p id="pet-desc"></p>
    </div>
    <button id="select-pet-btn">Seleccionar</button>
    <button id="back-to-welcome-pet" class="exit-btn">Salir</button>
  </div>

  <!-- Pantalla principal del juego -->
  <div id="background" class="room-home hidden">
    <!-- Dashboard de alimentos -->
    <button id="food-panel-toggle" title="Abrir menú de comida"></button>
    
    <!-- Botón de emergencia para cargar mascota -->
    <button id="force-pet-btn" style="position: fixed; left: 20px; bottom: 20px; z-index: 9999; background: #FFB7B2; padding: 10px; border-radius: 10px; display: none;">Cargar Mascota</button>
    
    <!-- Overlay para cuando el dashboard está abierto -->
    <div class="dashboard-overlay" id="dashboard-overlay"></div>
    
    <!-- Nuevo dashboard de comida -->
    <div id="food-dashboard">
      <div class="dashboard-header">
        <h3>Alimentación</h3>
        <button class="dashboard-close" id="dashboard-close">×</button>
      </div>
      
      <div class="dashboard-tabs">
        <div class="dashboard-tab active" data-tab="comida">🍔 Comidas</div>
        <div class="dashboard-tab" data-tab="bebida">🥤 Bebidas</div>
        <div class="dashboard-tab" data-tab="snack">🍪 Snacks</div>
        <div class="dashboard-tab" data-tab="postre">� Postres</div>
      </div>
      
      <div class="dashboard-content">
        <div id="tab-comida" class="tab-content active">
          <div id="food-panel-comida" class="food-panel"></div>
        </div>
        <div id="tab-bebida" class="tab-content">
          <div id="food-panel-bebida" class="food-panel"></div>
        </div>
        <div id="tab-snack" class="tab-content">
          <div id="food-panel-snack" class="food-panel"></div>
        </div>
        <div id="tab-postre" class="tab-content">
          <div id="food-panel-postre" class="food-panel"></div>
        </div>
        <!-- Espacio extra al final para asegurar que todo sea visible -->
        <div class="dashboard-safety-margin"></div>
      </div>
    </div>
    
    <div id="clouds-overlay" class="hidden"></div>
    <!-- Indicador de escenario -->
    <div id="scene-indicator"><span id="scene-icon">🏠</span></div>
    <div id="status-bars" style="margin-top: 16px;">
      <div class="status-bar">
        <span class="icon">❤️</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-salud"></div></div>
        <span id="val-salud">100</span>
      </div>
      <div class="status-bar">
        <span class="icon">🛁</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-salud-extra"></div></div>
        <span id="val-salud-extra">100</span>
      </div>
      <div class="status-bar">
        <span class="icon">🍔</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-comida"></div></div>
        <span id="val-comida">100</span>
      </div>
      <div class="status-bar">
        <span class="icon">⚡</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-energia"></div></div>
        <span id="val-energia">100</span>
      </div>
      <div class="status-bar">
        <span class="icon">😊</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-felicidad"></div></div>
        <span id="val-felicidad">100</span>
      </div>
    </div>
    <!-- Menú de navegación movido a la parte inferior -->
    <nav id="game-menu" style="position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); display: flex; justify-content: space-around; align-items: center; z-index: 100; box-shadow: 0 -2px 8px #bbb; height: 56px; padding: 0 8px;">
      <button id="menu-home" title="Casa" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🏠</span></button>
      <button id="menu-park" title="Parque" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🌳</span></button>
      <button id="menu-kitchen" title="Cocina" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🍳</span></button>
      <button id="menu-bath" title="Baño" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🛁</span></button>
      <button id="menu-bed" title="Dormir" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🛏️</span></button>
      <button id="menu-inventario" title="Inventario" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🎒</span></button>
      <button id="menu-tienda" title="Tienda" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🛒</span></button>
      <button id="menu-ajustes" title="Ajustes" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>⚙️</span></button>
      <button id="menu-salir" title="Salir" style="background: none; border: none; font-size: 1.7em; margin: 0 4px; width: 40px; height: 40px; border-radius: 50%; transition: background 0.2s;"><span>🚪</span></button>
    </nav>
    <!-- Elementos de escenario -->
    <div id="scene-elements">
      <!-- Casa principal -->
      <div class="scene-home scene-active">
        <div class="window-home">
          <svg width="120" height="80" viewBox="0 0 120 80">
            <ellipse cx="60" cy="40" rx="55" ry="35" fill="#fff" stroke="#bcd" stroke-width="4"/>
            <rect x="10" y="40" width="100" height="30" fill="#e0e7ff"/>
            <rect x="0" y="70" width="120" height="10" fill="#fbc02d"/>
          </svg>
          <div class="curtains"></div>
        </div>
        <div class="shelf-home">
          <svg width="120" height="40" viewBox="0 0 120 40">
            <rect x="0" y="30" width="120" height="10" fill="#c8b7a6"/>
            <rect x="10" y="10" width="10" height="20" fill="#8ecae6"/>
            <rect x="25" y="5" width="8" height="25" fill="#b5ead7"/>
            <rect x="40" y="15" width="7" height="15" fill="#f9c2d1"/>
            <ellipse cx="60" cy="25" rx="7" ry="7" fill="#a3e635"/>
            <ellipse cx="80" cy="20" rx="5" ry="10" fill="#388e3c"/>
          </svg>
          <div class="plant-light"></div>
        </div>
        <div id="clock"></div>
      </div>
      <!-- Parque -->
      <div class="scene-park">
        <div class="clouds-park"></div>
        <div class="swing"></div>
        <div class="ball"></div>
        <div class="tree"></div>
      </div>
      <!-- Cocina -->
      <div class="scene-kitchen">
        <div class="fridge"></div>
        <div class="table"></div>
        <div class="microwave"></div>
        <!-- <div class="hunger-bubbles"></div> -->
      </div>
      <!-- Baño -->
      <div class="scene-bath">
        <div class="bathtub"></div>
        <div class="mirror"></div>
        <div class="soap"></div>
        <div class="steam"></div>
      </div>
      <!-- Dormitorio -->
      <div class="scene-bed">
        <div class="bed"></div>
        <div class="moon"></div>
        <div class="zzz"></div>
        <div class="stars"></div>
      </div>
      <!-- Parque (SVG embebidos, sin archivos externos) -->
      <div class="scene-park">
        <div class="clouds-park">
          <svg width="120" height="60" viewBox="0 0 120 60">
            <ellipse cx="40" cy="30" rx="30" ry="18" fill="#fff" opacity="0.7"/>
            <ellipse cx="80" cy="20" rx="24" ry="14" fill="#fff" opacity="0.7"/>
          </svg>
        </div>
        <div class="swing">
          <svg width="60" height="100" viewBox="0 0 60 100">
            <rect x="25" y="20" width="10" height="60" fill="#8ecae6"/>
            <rect x="15" y="80" width="30" height="10" fill="#fbc02d"/>
          </svg>
        </div>
        <div class="ball">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" fill="#FFD166" stroke="#fff" stroke-width="4"/>
          </svg>
        </div>
        <div class="tree">
          <svg width="80" height="120" viewBox="0 0 80 120">
            <rect x="34" y="80" width="12" height="40" fill="#a67c52"/>
            <ellipse cx="40" cy="60" rx="32" ry="40" fill="#388e3c"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="pet-container">
      <div id="pet-svg-game"></div>
    </div>
    <!-- Menú circular de acciones -->
    <div id="actions-menu">
      <!-- Botón central: mascota -->
      <!-- Cocina (SVG embebidos) -->
      <div class="scene-kitchen">
        <div class="fridge">
          <svg width="60" height="120" viewBox="0 0 60 120">
            <rect x="6" y="10" width="48" height="100" rx="12" fill="#fff" stroke="#FFB7B2" stroke-width="3"/>
          </svg>
        </div>
        <div class="table">
          <svg width="120" height="30" viewBox="0 0 120 30">
            <rect x="10" y="10" width="100" height="18" rx="9" fill="#fbc02d"/>
          </svg>
        </div>
        <div class="microwave">
          <svg width="50" height="30" viewBox="0 0 50 30">
            <rect x="5" y="5" width="40" height="20" rx="8" fill="#fff" stroke="#FFB7B2" stroke-width="2"/>
          </svg>
        </div>
        <div class="hunger-bubbles">
          <svg width="40" height="40" viewBox="0 0 40 40">
            <circle cx="12" cy="20" r="8" fill="#6ee7b7" opacity="0.7"/>
            <circle cx="28" cy="12" r="6" fill="#3b82f6" opacity="0.7"/>
          </svg>
        </div>
      </div>
      <!-- Botones radiales ocultos visualmente -->
      <style>
        .radial-btn, .center-btn { display: none !important; }
      </style>
    </div>
  </div>
  <!-- Solo los scripts esenciales en el orden correcto -->
  <script src="clean-interface.js"></script>
  <script src="view-controller.js"></script>
  <script src="menu-controller.js"></script>
  <script src="pet-selector.js?v=20250731-1725"></script>
  <script src="element-remover.js"></script>
  <script src="pet-diagnostic.js"></script>
  <script src="stats-realtime.js"></script>
  <script src="action-buttons.js"></script>
  <script src="bars-fix.js"></script>
  <script src="design-fix.js"></script>
  <script src="simple-buttons.js"></script>
  <!-- <script src="main.js"></script> -->
  <script src="dashboard.js"></script>
  <script src="fix-drag-drop.js"></script>
  <script src="fix-pet-display.js"></script>
  <script src="auto-auth-debug.js"></script>
  <script src="improved-auth.js"></script>
</body>
</html>
